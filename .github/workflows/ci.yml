name: Foodgram UI tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Selenium tests
        run: pytest -v

      - name: Install Allure CLI
        if: always()
        run: |
          curl -fsSL https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz -o allure.tgz
          sudo tar -xzf allure.tgz -C /opt
          sudo ln -sf /opt/allure-2.32.0/bin/allure /usr/local/bin/allure

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results -o allure-report --clean

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
